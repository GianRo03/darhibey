<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Darhibey</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100%;
    height:100vh;
    overflow:hidden;
    font-family:Arial, sans-serif;
    background:url("playa.jpg") center center/cover no-repeat;
}

/* Oscurece ligeramente la imagen */
.overlay{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.25);
}

/* Nombre principal */
.title{
    position:absolute;
    top:45%;
    left:50%;
    transform:translate(-50%,-50%);

    font-size:6vw;
    font-weight:700;
    letter-spacing:10px;

    color:#f5c76a;

    text-shadow:
        0 0 5px rgba(245,199,106,0.4),
        0 0 15px rgba(245,199,106,0.3),
        0 0 25px rgba(245,199,106,0.2);

    z-index:20;

    animation:pulse 4s ease-in-out infinite;
}

@keyframes pulse{
    0%,100%{
        opacity:1;
    }

    50%{
        opacity:0.75;
    }
}

/* Reflejo */
.title-reflection{
    position:absolute;
    top:52%;
    left:50%;

    transform:
        translateX(-50%)
        scaleY(-1);

    font-size:6vw;
    font-weight:700;
    letter-spacing:10px;

    color:rgba(245,199,106,0.18);

    filter:blur(6px);

    mask-image:linear-gradient(
        to bottom,
        rgba(255,255,255,0.7),
        transparent
    );

    z-index:5;

    animation:reflection 4s ease-in-out infinite;
}

@keyframes reflection{
    0%,100%{
        transform:
        translateX(-50%)
        scaleY(-1)
        skewX(0deg);
    }

    50%{
        transform:
        translateX(-50%)
        scaleY(-1)
        skewX(3deg);
    }
}

/* Lluvia */
.rain{
    position:absolute;
    inset:0;
    overflow:hidden;
    z-index:30;
}

.drop{
    position:absolute;
    width:2px;
    background:linear-gradient(
        transparent,
        rgba(255,255,255,0.8)
    );

    animation:fall linear infinite;
}

@keyframes fall{

    from{
        transform:translateY(-120px);
    }

    to{
        transform:translateY(120vh);
    }
}

/* Agua */
.ocean{
    position:absolute;
    bottom:0;
    width:100%;
    height:22%;
    overflow:hidden;
    z-index:10;
}

.wave{
    position:absolute;
    width:200%;
    height:100%;
    left:-50%;
    border-radius:45%;
}

.wave1{
    background:rgba(255,255,255,0.05);
    animation:waveMove 10s linear infinite;
}

.wave2{
    background:rgba(255,180,80,0.08);
    animation:waveMove 14s linear infinite reverse;
}

.wave3{
    background:rgba(255,220,120,0.05);
    animation:waveMove 20s linear infinite;
}

@keyframes waveMove{

    0%{
        transform:translateX(0) translateY(0);
    }

    50%{
        transform:translateX(-5%) translateY(10px);
    }

    100%{
        transform:translateX(0) translateY(0);
    }
}

/* Relámpago */
.flash{
    position:absolute;
    inset:0;
    background:white;
    opacity:0;
    pointer-events:none;
    z-index:100;
}

</style>
</head>

<body>

<div class="overlay"></div>

<div class="title">
    DARHIBEY
</div>

<div class="title-reflection">
    DARHIBEY
</div>

<div class="rain" id="rain"></div>

<div class="ocean">
    <div class="wave wave1"></div>
    <div class="wave wave2"></div>
    <div class="wave wave3"></div>
</div>

<div class="flash" id="flash"></div>

<audio id="rainSound" loop>
    <source src="../assets/audio/rain.mp3" type="audio/mpeg">
</audio>

<script>

/* Crear lluvia */
const rain = document.getElementById("rain");

for(let i=0;i<450;i++){

    const drop=document.createElement("div");

    drop.classList.add("drop");

    drop.style.left=Math.random()*100+"vw";

    drop.style.height=
        (40+Math.random()*90)+"px";

    drop.style.opacity=
        0.2+Math.random()*0.8;

    drop.style.animationDuration=
        (0.4+Math.random()*0.8)+"s";

    drop.style.animationDelay=
        Math.random()*2+"s";

    rain.appendChild(drop);
}

/* Activar sonido */
document.addEventListener("click",()=>{

    const audio=
    document.getElementById("rainSound");

    audio.volume=0.4;

    audio.play();

},{once:true});

/* Relámpagos */
const flash=document.getElementById("flash");

function lightning(){

    flash.style.opacity="0.3";

    setTimeout(()=>{
        flash.style.opacity="0";
    },100);

    setTimeout(()=>{

        flash.style.opacity="0.15";

        setTimeout(()=>{
            flash.style.opacity="0";
        },50);

    },150);

    setTimeout(
        lightning,
        5000 + Math.random()*12000
    );
}

setTimeout(lightning,6000);

</script>

</body>
</html>
